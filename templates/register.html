{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block extra_css %}
<style>
    .register-container {
        max-width: 400px;
        margin: 0 auto;
    }
    
    .register-card {
        background: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    .register-card h2 {
        margin-bottom: 1.5rem;
        color: #333;
        text-align: center;
    }
    
    .form-group {
        margin-bottom: 1.5rem;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: #555;
        font-weight: 500;
    }
    
    .form-group input {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 1rem;
        transition: border-color 0.3s;
    }
    
    .form-group input:focus {
        outline: none;
        border-color: #667eea;
    }
    
    .error-message {
        color: #dc3545;
        font-size: 0.875rem;
        margin-top: 0.5rem;
    }
    
    .submit-btn {
        width: 100%;
        padding: 0.75rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: opacity 0.3s;
    }
    
    .submit-btn:hover {
        opacity: 0.9;
    }
    
    .form-errors {
        background-color: #f8d7da;
        color: #721c24;
        padding: 1rem;
        border-radius: 4px;
        margin-bottom: 1rem;
        border: 1px solid #f5c6cb;
    }
    
    .login-link {
        text-align: center;
        margin-top: 1rem;
        color: #666;
    }
    
    .login-link a {
        color: #667eea;
        text-decoration: none;
    }
    
    .login-link a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="register-container">
    <div class="register-card">
        <h2>Register</h2>
        
        {% if messages %}
        <div class="form-errors">
            {% for message in messages %}
                {{ message }}
            {% endfor %}
        </div>
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_email">Email</label>
                <input type="email" 
                       name="email" 
                       id="id_email" 
                       required 
                       autofocus
                       {% if email %}value="{{ email }}"{% endif %}>
            </div>
            
            <div class="form-group">
                <label for="id_password1">Password</label>
                <input type="password" 
                       name="password1" 
                       id="id_password1" 
                       required>
            </div>
            
            <div class="form-group">
                <label for="id_password2">Confirm Password</label>
                <input type="password" 
                       name="password2" 
                       id="id_password2" 
                       required>
            </div>
            
            <button type="submit" class="submit-btn">Register</button>
        </form>
        
        <div class="login-link">
            Already have an account? <a href="{% url 'login' %}">Login here</a>
        </div>
    </div>
</div>
{% endblock %}
