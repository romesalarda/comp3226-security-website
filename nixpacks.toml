[providers]
python = "3.11"

[phases.setup]
nixPkgs = ["...", "postgresql"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = ["python manage.py collectstatic --noinput"]

[start]
cmd = "python manage.py migrate && python manage.py create_superuser_from_env && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
